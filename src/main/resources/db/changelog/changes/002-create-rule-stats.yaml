databaseChangeLog:

  - changeSet:
      id: 002-01-create-rule-stats
      author: star-team
      changes:
        - createTable:
            tableName: rule_stats
            remarks: "Статистика срабатываний динамических правил"
            columns:
              - column:
                  name: rule_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_rule_stats
                    nullable: false
              - column:
                  name: count
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-02-fk-rule-stats
      author: star-team
      changes:
        - addForeignKeyConstraint:
            baseTableName: rule_stats
            baseColumnNames: rule_id
            referencedTableName: rule
            referencedColumnNames: id
            constraintName: fk_rule_stats_rule
            onDelete: CASCADE
            onUpdate: CASCADE